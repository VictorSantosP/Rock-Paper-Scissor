<!DOCTYPE html>
<html>
<head>
    <title>Rock-Paper-Scissors</title>
    
    <link rel="stylesheet" href="styles/06-pedra-papel-tesoura.css">

</head>

<body>
    <p class="title">Rock Paper Scissors</p>

    <button class="move-button js-rock-button">
        <img src="emojis/rock-emoji.png" class="move-icon">
    </button>

    <button class="move-button js-paper-button">
        <img src="emojis/paper-emoji.png" class="move-icon">
    </button>

    <button class="move-button js-scissors-button" >
        <img src="emojis/scissors-emoji.png" class="move-icon">
    </button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button onclick="
        resetScore();
        updateScoreElement();
    " class="reset-score-button">
        Reset Score
    </button>
    <button class="auto-play-button" onclick="
        autoPlay();
    ">Auto Play</button>
    <script src="scripts/06-pedra-papel-tesoura.js"></script>
</body>

</html>
